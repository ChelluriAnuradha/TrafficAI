
<style>
/* =========================================
   TRAFFICAI — PREMIUM DASHBOARD THEME
   ========================================= */

:root {
    --navy: #102a43;
    --navy-dark: #08213b;
    --orange: #f77f00;
    --bg: #f3f6fb;
    --white: #ffffff;
    --text: #243b53;
    --muted: #718096;
    --border: #e3eaf3;
    --shadow: 0 8px 28px rgba(16, 42, 67, 0.07);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

/* Navigation */

nav {
    min-height: 76px;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    color: white;
    background: linear-gradient(110deg, var(--navy-dark), var(--navy));
    box-shadow: 0 5px 20px rgba(8, 33, 59, 0.16);
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
}

.nav-links a {
    color: #eaf2f8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 13px;
    border-radius: 7px;
    transition: 0.25s ease;
}

.nav-links a:hover,
.nav-links a:focus-visible {
    color: #ffffff;
    background: rgba(247, 127, 0, 0.18);
    box-shadow: inset 0 -3px var(--orange);
}

/* Dashboard heading */

.dashboard {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 42px 5% 55px;
}

.dashboard h1 {
    text-align: left;
    color: var(--navy);
    font-size: clamp(30px, 4vw, 39px);
    line-height: 1.25;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.dashboard-description {
    text-align: left;
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 30px;
}

/* Statistics cards */

.stats-container {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    margin: 25px 0 38px;
}

.stat-card {
    min-width: 0;
    position: relative;
    overflow: hidden;
    background: var(--white);
    padding: 25px 22px;
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: left;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.stat-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--orange);
}

.stat-card:nth-child(2)::before {
    background: #2878d0;
}

.stat-card:nth-child(3)::before {
    background: #16a36a;
}

.stat-card:nth-child(4)::before {
    background: #805ad5;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 32px rgba(16, 42, 67, 0.12);
}

.stat-card h2 {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 14px;
}

.stat-card p {
    color: var(--navy);
    font-size: clamp(23px, 2.4vw, 31px);
    font-weight: 800;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

/* Chart panels */

.chart-container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    margin: 25px 0;
}

.chart-box {
    width: 100%;
    height: 370px;
    min-width: 0;
    padding: 24px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.25s ease;
}

.chart-box:hover {
    box-shadow: 0 12px 32px rgba(16, 42, 67, 0.10);
}

.chart-box h2 {
    color: var(--navy);
    text-align: left;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
}

.chart-box canvas {
    display: block;
    width: 100% !important;
    max-width: 100%;
}

/* Keep the third chart centered */

.chart-container:last-child .chart-box {
    grid-column: 1 / -1;
}

/* Footer */

footer {
    margin-top: 10px;
    padding: 27px 20px;
    background: var(--navy-dark);
    color: #eaf2f8;
    text-align: center;
    line-height: 1.9;
    font-size: 13px;
}

footer p:first-child {
    font-weight: 600;
}

/* Keyboard accessibility */

a:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
}

/* Tablet */

@media (max-width: 1050px) {
    .stats-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .chart-container {
        grid-template-columns: 1fr;
    }

    .chart-container:last-child .chart-box {
        grid-column: auto;
    }

    .chart-box {
        height: 360px;
    }
}

/* Mobile */

@media (max-width: 650px) {
    nav {
        justify-content: center;
        padding: 17px 4%;
    }

    .logo {
        font-size: 23px;
    }

    .nav-links {
        gap: 5px;
    }

    .nav-links a {
        font-size: 13px;
        padding: 8px 9px;
    }

    .dashboard {
        padding: 30px 16px 40px;
    }

    .dashboard h1 {
        font-size: 29px;
    }

    .dashboard-description {
        font-size: 14px;
        margin-bottom: 24px;
    }

    .stats-container {
        gap: 12px;
        margin-bottom: 28px;
    }

    .stat-card {
        padding: 19px 14px;
        border-radius: 11px;
    }

    .stat-card h2 {
        font-size: 12px;
    }

    .stat-card p {
        font-size: 23px;
    }

    .chart-container {
        gap: 16px;
        margin: 18px 0;
    }

    .chart-box {
        height: 320px;
        padding: 17px 13px;
        border-radius: 12px;
    }

    .chart-box h2 {
        font-size: 16px;
        margin-bottom: 16px;
    }
}

@media (max-width: 360px) {
    .stats-container {
        grid-template-columns: 1fr;
    }
}
</style>
